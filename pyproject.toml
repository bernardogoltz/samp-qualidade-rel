[project]
name = "samp-dq"
version = "0.1.0"
description = "Módulo open source para análise e validação de qualidade dos dados do SAMP (ANEEL)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bernardo Ivo Goltz" }]
requires-python = ">=3.11"
keywords = ["aneel", "samp", "dados-abertos", "ckan", "qualidade-de-dados"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/bergoltzx2/samp-dq"
Issues = "https://github.com/bergoltzx2/samp-dq/issues"

[project.scripts]
samp-dq = "samp_dq.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samp_dq"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260730",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "rede: teste que acessa a internet (portal de dados abertos da ANEEL)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# 3.12, não 3.11: os stubs do numpy (via pandas-stubs) usam sintaxe PEP 695, que o mypy não
# consegue sequer parsear com alvo 3.11. A compatibilidade com 3.11 segue garantida pela
# matriz de testes do CI, que roda a suíte nas três versões suportadas.
python_version = "3.12"
files = ["src"]
strict = true

# O pyarrow não publica py.typed. O uso aqui é pontual (construir tipos e converter arrays na
# normalização), então tratá-lo como não tipado custa pouco — ao contrário do pandas, que
# atravessa o módulo inteiro e por isso ganhou stubs de verdade.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
